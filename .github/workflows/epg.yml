name: Generate EPG

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/epg.yml'
      - 'list.xml'
      - 'generate_epg.py'
      - 'translator.py'

permissions:
  contents: write

concurrency:
  group: git-write-lock
  cancel-in-progress: false

jobs:
  build-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install deep-translator langdetect lxml

      - name: Clone IPTV-ORG EPG Tool
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg-tool

      - name: Install Node Dependencies
        working-directory: epg-tool
        run: npm ci

      - name: Copy Custom Channels File
        run: |
          cp list.xml epg-tool/sites/list.xml

      - name: Generate Base EPG
        working-directory: epg-tool
        run: |
          npm run grab -- \
            --channels=sites/list.xml \
            --output=../epg.xml \
            --maxConnections=8

      - name: Backup pre-merge epg.xml
        run: |
          cp epg.xml epg.xml.bak

      - name: Verify Unified EPG Output Is Well-Formed
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import sys

          path = "epg.xml"

          try:
              root = ET.parse(path).getroot()
          except Exception as e:
              print(f"FATAL: epg.xml is not well-formed XML: {e}")
              sys.exit(1)

          channels = len(root.findall("channel"))
          programmes = len(root.findall("programme"))

          print("==== Unified EPG Stats ====")
          print(f"Total Channels: {channels}")
          print(f"Total Programmes: {programmes}")

          if channels == 0 or programmes == 0:
              print("FATAL: epg.xml contains no channels or programmes.")
              sys.exit(1)
          PY

      - name: Translate EPG to English
        run: |
          python3 translator.py epg.xml epg.xml

      - name: Compress epg.xml
        run: |
          gzip -c epg.xml > epg.xml.gz
          ls -lh epg.xml.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: epg-output
          path: epg.xml.gz

      - name: Generate list.txt Index
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import sys

          src = Path("list.xml")
          out = Path("list.txt")

          try:
              tree = ET.parse(src)
          except Exception as e:
              print(f"FATAL: failed to parse {src}: {e}")
              sys.exit(1)

          root = tree.getroot()
          entries = []

          for channel in root.findall("channel"):
              tvg_id = channel.attrib.get("xmltv_id", "").strip()
              name = (channel.text or "").strip()

              if tvg_id:
                  entries.append(f'{tvg_id} "{name}"')

          entries = sorted(set(entries), key=str.lower)

          out.write_text(
              "\n".join(entries),
              encoding="utf-8"
          )

          print(f"Generated list.txt with {len(entries)} entries.")
          PY

      - name: Cleanup Temporary Files
        if: always()
        run: |
          rm -f epg.xml.bak
          rm -rf epg-tool

      - name: Commit and Push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Repository status:"
          git status --short

          # Hanya file output yang disimpan
          git add epg.xml epg.xml.gz list.txt

          if git diff-index --quiet HEAD --; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          LAST_AUTHOR=$(git log -1 --format='%ae')
          BOT_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          IS_AMEND=false

          if [ "$LAST_AUTHOR" = "$BOT_EMAIL" ]; then
            echo "Last commit by bot. Amending..."
            git commit --amend --no-edit --date="$TIMESTAMP"
            IS_AMEND=true
          else
            echo "Last commit by user. Creating new commit..."
            git commit -m "Auto-Update $TIMESTAMP"
          fi

          for i in 1 2 3; do
            echo "Syncing with remote (Attempt $i/3)..."

            git fetch origin main

            if ! git rebase origin/main -X theirs; then
              echo "Rebase failed."
              git rebase --abort || true
              exit 1
            fi

            echo "Pushing..."

            if [ "$IS_AMEND" = true ]; then
              git push origin main --force-with-lease && exit 0
            else
              git push origin main && exit 0
            fi

            echo "Push rejected. Retrying..."
            sleep 2
          done

          echo "Push failed after 3 attempts."
          exit 1
